# Test profile: fresh in-memory H2 (PostgreSQL mode) per context.
# Flyway migrations must stay portable enough to run here; long-term these
# tests should move to Testcontainers-PostgreSQL (needs Docker, unavailable).
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
