# Common configuration for all profiles.
#
# Profile model:
#   * default  -> local H2 dev profile (zero-setup `mvn spring-boot:run`).
#     `spring.profiles.default` only applies when nothing else sets
#     spring.profiles.active, so PostgreSQL is activated explicitly with
#     SPRING_PROFILES_ACTIVE=postgres — it is never the silent default.
#   * test     -> H2 in-memory (application-test.yml), used by `mvn test`.
#   * postgres -> production-style config (datasource from env, section below).
spring:
  profiles:
    # Works with zero setup; override with SPRING_PROFILES_ACTIVE=postgres.
    default: dev
  application:
    name: habit-tracker
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate must never create or drop tables.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      # Disable Boot's auto-configured default user; we provide real auth.
      name:
      password:
  servlet:
    multipart:
      enabled: false

server:
  # Trust X-Forwarded-* headers when deployed behind a reverse proxy.
  forward-headers-strategy: framework
  servlet:
    session:
      # 12-hour sessions.
      timeout: 12h
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        # Set AUTH_COOKIE_SECURE=true behind HTTPS in production.
        secure: ${AUTH_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        # Only health + info are exposed publicly for now.
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Comma-separated allow-list. NEVER use "*" together with credentials.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    # Dev convenience ONLY: log raw password-reset tokens to the console
    # (default false) because no real email provider is wired up yet.
    dev-expose-reset-token: ${APP_DEV_EXPOSE_RESET_TOKEN:false}

---
# PostgreSQL profile: activated explicitly via SPRING_PROFILES_ACTIVE=postgres.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000
